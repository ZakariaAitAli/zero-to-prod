name: Work Items CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      workflow: ${{ steps.changes.outputs.workflow }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual execution: using conservative full static validation."
            mapfile -t classification < <(
              ./scripts/classify-ci-changes.sh --conservative
            )
          else
            case "$EVENT_NAME" in
              pull_request)
                base_sha="$PR_BASE_SHA"
                head_sha="$PR_HEAD_SHA"
                diff_range="${base_sha}...${head_sha}"
                ;;
              push)
                base_sha="$PUSH_BASE_SHA"
                head_sha="$PUSH_HEAD_SHA"
                diff_range="${base_sha}..${head_sha}"
                ;;
              *)
                echo "::error::Unsupported event: ${EVENT_NAME}"
                exit 1
                ;;
            esac

            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::Could not determine the change range."
              exit 1
            fi

            echo "Change range: ${diff_range}"

            mapfile -t changed_files < <(
              git diff --name-only "$diff_range"
            )

            echo "Changed files:"
            printf '  %s\n' "${changed_files[@]}"

            ci_control_changed=false

            for changed_file in "${changed_files[@]}"; do
              case "$changed_file" in
                .github/workflows/*|scripts/classify-ci-changes.sh|scripts/test-ci-change-classifier.sh|scripts/verify-ci-required.sh|scripts/test-ci-required-gate.sh)
                  ci_control_changed=true
                  ;;
              esac
            done

            mapfile -t classification < <(
              ./scripts/classify-ci-changes.sh "${changed_files[@]}"
            )
          fi

          backend=false
          frontend=false
          workflow=false

          for result in "${classification[@]}"; do
            key="${result%%=*}"
            value="${result#*=}"

            case "$key" in
              backend) backend="$value" ;;
              frontend) frontend="$value" ;;
              workflow) workflow="$value" ;;
              *)
                echo "::error::Unexpected classifier output: ${result}"
                exit 1
                ;;
            esac

          done

          # CI control-plane files must not be able to skip validation of
          # their own policy. This guard is intentionally independent of
          # classifier output.
          if [ "${ci_control_changed:-false}" = "true" ]; then
            backend=true
            frontend=true
            workflow=true
          fi

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "workflow=${workflow}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Change-aware CI"
            echo
            echo "- Backend validation: \`${backend}\`"
            echo "- Frontend validation: \`${frontend}\`"
            echo "- Workflow validation: \`${workflow}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-validation:
    name: Validate Work Items backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/work-items

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/work-items/go.mod
          cache: false

      - name: Display tool versions
        run: |
          echo "Go version:"
          go version

          echo "Docker version:"
          docker version --format '{{.Client.Version}}'

      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l .)"

          if [ -n "$unformatted_files" ]; then
            echo "::error::The following Go files are not formatted:"
            echo "$unformatted_files"
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Run Go vet
        run: go vet ./...

      - name: Run dependency-free tests
        run: go test ./... -v -count=1

      - name: Start local integration dependencies
        working-directory: .
        run: |
          ./tools/postgres-local start
          ./tools/postgres-local build-migrate
          ./tools/postgres-local migrate-up
          ./tools/rabbitmq-local start

      - name: Run API integration tests
        env:
          OUTBOX_INTEGRATION_DATABASE_URL: postgres://zero_to_prod_app:zero-to-prod-local-app@127.0.0.1:55432/zero_to_prod?sslmode=disable
          ACCEPTANCE_FAILURE_MIGRATOR_DATABASE_URL: postgres://zero_to_prod_migrator:zero-to-prod-local-migrator@127.0.0.1:55432/zero_to_prod?sslmode=disable
          RABBITMQ_PUBLISHER_URL: amqp://zero_to_prod_publisher:zero-to-prod-local-rabbitmq-publisher@127.0.0.1:5672/zero_to_prod
          RABBITMQ_QUEUE: work_item_processing
        run: |
          output="${RUNNER_TEMP}/work-items-api-integration.out"

          go test ./api \
            -v \
            -count=1 \
            2>&1 | tee "$output"

          if grep -q -- '--- SKIP:' "$output"; then
            echo "::error::API integration validation skipped one or more tests."
            grep -- '--- SKIP:' "$output"
            exit 1
          fi

      - name: Reset shared RabbitMQ integration boundary
        working-directory: .
        run: |
          docker compose \
            --project-name zero-to-prod-rabbitmq \
            --file infra/local/rabbitmq/compose.yaml \
            exec -T rabbitmq \
            rabbitmqctl \
              -p zero_to_prod \
              purge_queue \
              work_item_processing

          queue_state="$(
            docker compose \
              --project-name zero-to-prod-rabbitmq \
              --file infra/local/rabbitmq/compose.yaml \
              exec -T rabbitmq \
              rabbitmqctl \
                -p zero_to_prod \
                list_queues \
                name \
                messages_ready \
                messages_unacknowledged \
                messages \
                consumers \
              2>/dev/null \
            | awk '
                $1 == "work_item_processing" {
                  print $2 "|" $3 "|" $4 "|" $5
                }
              '
          )"

          echo "RabbitMQ integration boundary: ${queue_state}"

          if [ "$queue_state" != "0|0|0|0" ]; then
            echo "::error::RabbitMQ integration queue is not clean: ${queue_state}"
            exit 1
          fi

      - name: Run worker integration tests
        env:
          WORKER_DATABASE_URL: postgres://zero_to_prod_worker:zero-to-prod-local-worker@127.0.0.1:55432/zero_to_prod?sslmode=disable
          WORKER_FIXTURE_DATABASE_URL: postgres://zero_to_prod_migrator:zero-to-prod-local-migrator@127.0.0.1:55432/zero_to_prod?sslmode=disable
          RABBITMQ_WORKER_URL: amqp://zero_to_prod_worker:zero-to-prod-local-rabbitmq-worker@127.0.0.1:5672/zero_to_prod
          RABBITMQ_FIXTURE_URL: amqp://zero_to_prod:zero-to-prod-local-rabbitmq@127.0.0.1:5672/zero_to_prod
          RABBITMQ_QUEUE: work_item_processing
        run: |
          output="${RUNNER_TEMP}/work-items-worker-integration.out"

          go test ./worker \
            -v \
            -count=1 \
            2>&1 | tee "$output"

          if grep -q -- '--- SKIP:' "$output"; then
            echo "::error::Worker integration validation skipped one or more tests."
            grep -- '--- SKIP:' "$output"
            exit 1
          fi

      - name: Clean up local integration dependencies
        if: always()
        working-directory: .
        run: |
          rabbitmq_rc=0
          postgres_rc=0

          ./tools/rabbitmq-local destroy || rabbitmq_rc=$?
          ./tools/postgres-local destroy || postgres_rc=$?

          if [ "$rabbitmq_rc" -ne 0 ] ||
             [ "$postgres_rc" -ne 0 ]; then
            echo "::error::Local integration dependency cleanup failed."
            echo "RabbitMQ cleanup exit code: ${rabbitmq_rc}"
            echo "PostgreSQL cleanup exit code: ${postgres_rc}"
            exit 1
          fi

      - name: Build Docker image
        env:
          IMAGE_NAME: zero-to-prod-work-items-api
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image: ${image}"

          docker build \
            --file api/Dockerfile \
            --build-arg VERSION="${GITHUB_SHA}" \
            --tag "${image}" \
            .

          size_bytes="$(
            docker image inspect \
              "${image}" \
              --format '{{.Size}}'
          )"

          configured_user="$(
            docker image inspect \
              "${image}" \
              --format '{{.Config.User}}'
          )"

          echo "Image: ${image}"
          echo "Size: ${size_bytes} bytes"
          echo "Configured user: ${configured_user}"

          {
            echo "## Work Items API image"
            echo
            echo "- Image: \`${image}\`"
            echo "- Version: \`${GITHUB_SHA}\`"
            echo "- Size: \`${size_bytes} bytes\`"
            echo "- Runtime user: \`${configured_user}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-validation:
    name: Validate Work Items frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/work-items/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/work-items/web/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Display tool versions
        run: |
          node --version
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  workflow-validation:
    name: Validate CI workflows
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/work-items/go.mod
          cache: false

      - name: Validate CI policy scripts
        run: |
          bash -n scripts/classify-ci-changes.sh
          bash -n scripts/test-ci-change-classifier.sh
          bash -n scripts/verify-ci-required.sh
          bash -n scripts/test-ci-required-gate.sh
          bash -n tools/work-items-api-local
          bash -n tools/postgres-local
          bash -n tools/postgres-backup-local
          bash -n tools/work-items-worker-local
          bash -n tools/rabbitmq-local
          bash -n infra/local/postgres/init/001-roles.sh

          docker compose -f infra/local/compose.yaml config --quiet

          ./scripts/test-ci-change-classifier.sh
          ./scripts/test-ci-required-gate.sh

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  ci-required:
    name: CI required
    needs:
      - changes
      - backend-validation
      - frontend-validation
      - workflow-validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify required validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}

          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}

          WORKFLOW_REQUIRED: ${{ needs.changes.outputs.workflow }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation.result }}
        run: |
          ./scripts/verify-ci-required.sh \
            "$CHANGES_RESULT" \
            "$APP_REQUIRED" \
            "$APP_RESULT" \
            "$WORKFLOW_REQUIRED" \
            "$WORKFLOW_RESULT"
