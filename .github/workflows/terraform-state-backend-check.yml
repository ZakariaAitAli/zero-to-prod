name: Terraform State Backend Check

on:
  push:
    branches:
      - feat/issue-35-remote-state

permissions:
  contents: read

jobs:
  verify-remote-state:
    name: Verify remote Terraform state through OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment: development

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::333534066371:role/zero-to-prod-github-actions
          aws-region: eu-west-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Initialize remote backend
        run: |
          terraform \
            -chdir=infra/terraform/development-verification \
            init \
            -input=false \
            -lockfile=readonly

      - name: Verify remote state is readable
        run: |
          set -euo pipefail

          state_json="$(
            terraform \
              -chdir=infra/terraform/development-verification \
              state pull
          )"

          summary="$(
            jq '{
              serial,
              lineage,
              resource_count: (.resources | length)
            }' <<<"$state_json"
          )"

          echo "$summary"

          serial="$(jq -r '.serial' <<<"$state_json")"
          lineage="$(jq -r '.lineage' <<<"$state_json")"

          if [ "$serial" -lt 1 ]; then
            echo "::error::Expected remote state serial >= 1, got ${serial}"
            exit 1
          fi

          if [ -z "$lineage" ]; then
            echo "::error::Expected non-empty remote state lineage"
            exit 1
          fi

          echo "Remote Terraform state is readable through GitHub OIDC."
