name: Demo API CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      app: ${{ steps.changes.outputs.app }}
      terraform: ${{ steps.changes.outputs.terraform }}
      workflow: ${{ steps.changes.outputs.workflow }}
      deploy: ${{ steps.changes.outputs.deploy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual execution: using conservative full static validation."
            mapfile -t classification < <(
              ./scripts/classify-ci-changes.sh --conservative
            )
          else
            case "$EVENT_NAME" in
              pull_request)
                base_sha="$PR_BASE_SHA"
                head_sha="$PR_HEAD_SHA"
                diff_range="${base_sha}...${head_sha}"
                ;;
              push)
                base_sha="$PUSH_BASE_SHA"
                head_sha="$PUSH_HEAD_SHA"
                diff_range="${base_sha}..${head_sha}"
                ;;
              *)
                echo "::error::Unsupported event: ${EVENT_NAME}"
                exit 1
                ;;
            esac

            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::Could not determine the change range."
              exit 1
            fi

            echo "Change range: ${diff_range}"

            mapfile -t changed_files < <(
              git diff --name-only "$diff_range"
            )

            echo "Changed files:"
            printf '  %s\n' "${changed_files[@]}"

            ci_control_changed=false

            for changed_file in "${changed_files[@]}"; do
              case "$changed_file" in
                .github/workflows/*|scripts/classify-ci-changes.sh|scripts/test-ci-change-classifier.sh|scripts/verify-ci-required.sh|scripts/test-ci-required-gate.sh)
                  ci_control_changed=true
                  ;;
              esac
            done

            mapfile -t classification < <(
              ./scripts/classify-ci-changes.sh "${changed_files[@]}"
            )
          fi

          app=false
          terraform=false
          workflow=false
          deploy=false

          for result in "${classification[@]}"; do
            key="${result%%=*}"
            value="${result#*=}"

            case "$key" in
              app) app="$value" ;;
              terraform) terraform="$value" ;;
              workflow) workflow="$value" ;;
              deploy) deploy="$value" ;;
              *)
                echo "::error::Unexpected classifier output: ${result}"
                exit 1
                ;;
            esac

          done

          # CI control-plane files must not be able to skip validation of
          # their own policy. This guard is intentionally independent of
          # classifier output.
          if [ "${ci_control_changed:-false}" = "true" ]; then
            app=true
            terraform=true
            workflow=true
          fi

          {
            echo "app=${app}"
            echo "terraform=${terraform}"
            echo "workflow=${workflow}"
            echo "deploy=${deploy}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Change-aware CI"
            echo
            echo "- Application validation: \`${app}\`"
            echo "- Terraform validation: \`${terraform}\`"
            echo "- Workflow validation: \`${workflow}\`"
            echo "- Publish/deploy eligible: \`${deploy}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  app-validation:
    name: Validate demo API
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/demo-api

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/demo-api/go.mod
          cache: false

      - name: Display tool versions
        run: |
          echo "Go version:"
          go version

          echo "Docker version:"
          docker version --format '{{.Client.Version}}'

      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l .)"

          if [ -n "$unformatted_files" ]; then
            echo "::error::The following Go files are not formatted:"
            echo "$unformatted_files"
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Run Go vet
        run: go vet ./...

      - name: Run automated tests
        run: go test ./... -v -count=1

      - name: Build Docker image
        env:
          IMAGE_NAME: zero-to-prod-demo-api
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image: ${image}"

          docker build \
            --build-arg VERSION="${GITHUB_SHA}" \
            --tag "${image}" \
            .

          size_bytes="$(
            docker image inspect \
              "${image}" \
              --format '{{.Size}}'
          )"

          configured_user="$(
            docker image inspect \
              "${image}" \
              --format '{{.Config.User}}'
          )"

          echo "Image: ${image}"
          echo "Size: ${size_bytes} bytes"
          echo "Configured user: ${configured_user}"

          {
            echo "## Demo API image"
            echo
            echo "- Image: \`${image}\`"
            echo "- Version: \`${GITHUB_SHA}\`"
            echo "- Size: \`${size_bytes} bytes\`"
            echo "- Runtime user: \`${configured_user}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export Docker image
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.deploy == 'true'
        env:
          IMAGE_NAME: zero-to-prod-demo-api
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}"

          docker save \
            --output demo-api-image.tar \
            "${image}"

      - name: Upload Docker image artifact
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.deploy == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/demo-api/demo-api-image.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  terraform-validation:
    name: Validate Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform
        run: |
          set -euo pipefail

          for terraform_root in \
            infra/terraform/bootstrap/development-verification-state \
            infra/terraform/development-verification
          do
            echo "Validating ${terraform_root}"

            terraform \
              -chdir="${terraform_root}" \
              init \
              -backend=false \
              -input=false \
              -lockfile=readonly

            terraform \
              -chdir="${terraform_root}" \
              validate
          done

  workflow-validation:
    name: Validate CI workflows
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/demo-api/go.mod
          cache: false

      - name: Validate CI policy scripts
        run: |
          bash -n scripts/classify-ci-changes.sh
          bash -n scripts/test-ci-change-classifier.sh
          bash -n scripts/verify-ci-required.sh
          bash -n scripts/test-ci-required-gate.sh

          ./scripts/test-ci-change-classifier.sh
          ./scripts/test-ci-required-gate.sh

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  ci-required:
    name: CI required
    needs:
      - changes
      - app-validation
      - terraform-validation
      - workflow-validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify required validations
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}

          APP_REQUIRED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app-validation.result }}

          TERRAFORM_REQUIRED: ${{ needs.changes.outputs.terraform }}
          TERRAFORM_RESULT: ${{ needs.terraform-validation.result }}

          WORKFLOW_REQUIRED: ${{ needs.changes.outputs.workflow }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation.result }}
        run: |
          ./scripts/verify-ci-required.sh \
            "$CHANGES_RESULT" \
            "$APP_REQUIRED" \
            "$APP_RESULT" \
            "$TERRAFORM_REQUIRED" \
            "$TERRAFORM_RESULT" \
            "$WORKFLOW_REQUIRED" \
            "$WORKFLOW_RESULT"

  publish-image:
    name: Publish immutable image to ECR
    needs:
      - changes
      - app-validation
      - ci-required
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.app-validation.result == 'success' &&
      needs.ci-required.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      id-token: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-api-image.tar

      - name: Load Docker image
        run: docker load --input demo-api-image.tar

      - name: Tag image for Amazon ECR
        env:
          IMAGE_NAME: zero-to-prod-demo-api
          ECR_REGISTRY: 333534066371.dkr.ecr.eu-west-3.amazonaws.com
        run: |
          source_image="${IMAGE_NAME}:${GITHUB_SHA}"
          target_image="${ECR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker tag "${source_image}" "${target_image}"

          echo "Tagged image: ${target_image}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::333534066371:role/zero-to-prod-github-actions
          aws-region: eu-west-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-west-3 \
            | docker login \
                --username AWS \
                --password-stdin 333534066371.dkr.ecr.eu-west-3.amazonaws.com

      - name: Push image to Amazon ECR
        env:
          IMAGE_NAME: zero-to-prod-demo-api
          ECR_REGISTRY: 333534066371.dkr.ecr.eu-west-3.amazonaws.com
        run: |
          image="${ECR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Pushing image: ${image}"

          docker push "${image}"

  deploy-development:
    name: Deploy to development
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: demo-api-development-deployment
      cancel-in-progress: false

    environment: development

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render deployment task definition
        env:
          ECR_REGISTRY: 333534066371.dkr.ecr.eu-west-3.amazonaws.com
          IMAGE_NAME: zero-to-prod-demo-api
        run: |
          template="infra/aws/ecs/demo-api-task-definition.json"
          rendered="${RUNNER_TEMP}/demo-api-task-definition.json"
          image="${ECR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          template_image="$(
            jq -r \
              '.containerDefinitions[]
               | select(.name == "demo-api")
               | .image' \
              "$template"
          )"

          if [ "$template_image" != "IMAGE_URI_TO_BE_RENDERED" ]; then
            echo "::error::Unexpected image value in task definition template: ${template_image}"
            exit 1
          fi

          jq \
            --arg image "$image" \
            '(.containerDefinitions[]
              | select(.name == "demo-api")
              | .image) = $image' \
            "$template" > "$rendered"

          echo "Rendered deployment image: ${image}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::333534066371:role/zero-to-prod-github-actions
          aws-region: eu-west-3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Initialize verification Terraform
        run: |
          terraform \
            -chdir=infra/terraform/development-verification \
            init \
            -input=false \
            -lockfile=readonly

      - name: Plan verification infrastructure
        run: |
          terraform \
            -chdir=infra/terraform/development-verification \
            plan \
            -input=false \
            -out=verification.tfplan

      - name: Reject stale deployment
        run: |
          main_sha="$(
            git ls-remote --exit-code origin refs/heads/main \
              | awk '{print $1}'
          )"

          if [ -z "$main_sha" ]; then
            echo "::error::Could not resolve refs/heads/main from origin."
            exit 1
          fi

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${main_sha}"

          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::Rejecting stale deployment: ${GITHUB_SHA} is no longer the current main revision (${main_sha})."
            exit 1
          fi

          echo "Deployment freshness check passed."

      - name: Create verification infrastructure
        id: verification-infrastructure
        run: |
          terraform \
            -chdir=infra/terraform/development-verification \
            apply \
            -input=false \
            -auto-approve \
            verification.tfplan

          base_url="$(
            terraform \
              -chdir=infra/terraform/development-verification \
              output \
              -raw \
              verification_base_url
          )"

          echo "base_url=${base_url}" >> "$GITHUB_OUTPUT"
          echo "Verification endpoint: ${base_url}"

      - name: Register deployment task definition
        id: register-task-definition
        env:
          TASK_DEFINITION_FILE: ${{ runner.temp }}/demo-api-task-definition.json
        run: |
          task_definition_arn="$(
            aws ecs register-task-definition \
              --cli-input-json "file://${TASK_DEFINITION_FILE}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "task_definition_arn=${task_definition_arn}" >> "$GITHUB_OUTPUT"

          echo "Registered task definition: ${task_definition_arn}"

      - name: Deploy task definition and start verification task
        id: deploy-verification-task
        env:
          ECS_CLUSTER: zero-to-prod-dev
          ECS_SERVICE: demo-api
          TASK_DEFINITION_ARN: ${{ steps.register-task-definition.outputs.task_definition_arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count 1 \
            --query 'service.{Service:serviceName,TaskDefinition:taskDefinition,DesiredCount:desiredCount}' \
            --output json

      - name: Wait for ECS service stability
        env:
          ECS_CLUSTER: zero-to-prod-dev
          ECS_SERVICE: demo-api
        run: |
          echo "Waiting for ${ECS_SERVICE} in ${ECS_CLUSTER} to stabilize..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS service reached a stable state."

      - name: Verify deployment over HTTP
        env:
          BASE_URL: ${{ steps.verification-infrastructure.outputs.base_url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: ./scripts/verify-deployment.sh

      - name: Verify and report deployment
        env:
          ECS_CLUSTER: zero-to-prod-dev
          ECS_SERVICE: demo-api
          EXPECTED_TASK_DEFINITION: ${{ steps.register-task-definition.outputs.task_definition_arn }}
          ENVIRONMENT: development
        run: |
          deployed_task_definition="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [ "$deployed_task_definition" != "$EXPECTED_TASK_DEFINITION" ]; then
            echo "::error::Expected ${EXPECTED_TASK_DEFINITION}, but ECS reports ${deployed_task_definition}"
            exit 1
          fi

          echo "Environment: ${ENVIRONMENT}"
          echo "Version: ${GITHUB_SHA}"
          echo "Task definition: ${deployed_task_definition}"

          {
            echo "## Development deployment"
            echo
            echo "- Environment: \`${ENVIRONMENT}\`"
            echo "- Version: \`${GITHUB_SHA}\`"
            echo "- Task definition: \`${deployed_task_definition}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop verification task
        if: always() && steps.deploy-verification-task.outcome != 'skipped'
        env:
          ECS_CLUSTER: zero-to-prod-dev
          ECS_SERVICE: demo-api
        run: |
          echo "Scaling ${ECS_SERVICE} back to zero..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0 \
            --query 'service.{Service:serviceName,DesiredCount:desiredCount,RunningCount:runningCount}' \
            --output json

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Verification task stopped."

      - name: Destroy verification infrastructure
        if: always() && steps.verification-infrastructure.outcome != 'skipped'
        run: |
          echo "Destroying temporary verification infrastructure..."

          terraform \
            -chdir=infra/terraform/development-verification \
            destroy \
            -input=false \
            -auto-approve

          echo "Verification infrastructure destroyed."
