name: Demo API CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build demo API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/demo-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/demo-api/go.mod
          cache: false

      - name: Display tool versions
        run: |
          echo "Go version:"
          go version

          echo "Docker version:"
          docker version --format '{{.Client.Version}}'

      - name: Check Go formatting
        run: |
          unformatted_files="$(gofmt -l .)"

          if [ -n "$unformatted_files" ]; then
            echo "::error::The following Go files are not formatted:"
            echo "$unformatted_files"
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Run Go vet
        run: go vet ./...

      - name: Run automated tests
        run: go test ./... -v -count=1

      - name: Build Docker image
        env:
          IMAGE_NAME: zero-to-prod-demo-api
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building image: ${image}"

          docker build \
            --build-arg VERSION="${GITHUB_SHA}" \
            --tag "${image}" \
            .

          size_bytes="$(
            docker image inspect \
              "${image}" \
              --format '{{.Size}}'
          )"

          configured_user="$(
            docker image inspect \
              "${image}" \
              --format '{{.Config.User}}'
          )"

          echo "Image: ${image}"
          echo "Size: ${size_bytes} bytes"
          echo "Configured user: ${configured_user}"

          {
            echo "## Demo API image"
            echo
            echo "- Image: \`${image}\`"
            echo "- Version: \`${GITHUB_SHA}\`"
            echo "- Size: \`${size_bytes} bytes\`"
            echo "- Runtime user: \`${configured_user}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: zero-to-prod-demo-api
        run: |
          image="${IMAGE_NAME}:${GITHUB_SHA}"

          docker save \
            --output demo-api-image.tar \
            "${image}"

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/demo-api/demo-api-image.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  verify-aws-oidc:
    name: Verify GitHub to AWS OIDC
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      id-token: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-api-image.tar

      - name: Load Docker image
        run: docker load --input demo-api-image.tar

      - name: Tag image for Amazon ECR
        env:
          IMAGE_NAME: zero-to-prod-demo-api
          ECR_REGISTRY: 333534066371.dkr.ecr.eu-west-3.amazonaws.com
        run: |
          source_image="${IMAGE_NAME}:${GITHUB_SHA}"
          target_image="${ECR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker tag "${source_image}" "${target_image}"

          echo "Tagged image: ${target_image}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::333534066371:role/zero-to-prod-github-actions
          aws-region: eu-west-3

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-west-3 \
            | docker login \
                --username AWS \
                --password-stdin 333534066371.dkr.ecr.eu-west-3.amazonaws.com

      - name: Push image to Amazon ECR
        env:
          IMAGE_NAME: zero-to-prod-demo-api
          ECR_REGISTRY: 333534066371.dkr.ecr.eu-west-3.amazonaws.com
        run: |
          image="${ECR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Pushing image: ${image}"

          docker push "${image}"
