worker_processes 1;
events { worker_connections 2048; }
stream {
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream database {
    zone database 64k;
    # The operator changes only this allowlisted target after fencing.
    server postgres:5432 resolve;
  }
  upstream brokers {
    zone brokers 64k;
    server rabbitmq:5672 resolve max_fails=1 fail_timeout=2s;
    server rabbit2:5672 resolve max_fails=1 fail_timeout=2s;
    server rabbit3:5672 resolve max_fails=1 fail_timeout=2s;
  }
  server { listen 5432; proxy_connect_timeout 1s; proxy_pass database; }
  server { listen 5672; proxy_connect_timeout 1s; proxy_next_upstream on; proxy_pass brokers; }
}
