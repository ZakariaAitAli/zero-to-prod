# Jaeger v2 all-in-one with bounded in-memory storage: traces are lost on
# restart and the oldest are evicted beyond max_traces (see the guide).
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memstore
    ui:
      config_file: ""
  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 50000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
