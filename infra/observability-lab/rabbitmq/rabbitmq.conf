# Zero-to-Prod observability lab RabbitMQ configuration.
#
# No host ports are published. Users, permissions, the vhost, and the
# processing queue come from a definitions file generated outside Git with
# per-lab password hashes (the same identities as the security lab, without
# TLS). Prometheus scrapes the built-in rabbitmq_prometheus endpoint.
listeners.tcp.default = 5672
load_definitions = /run/secrets/rabbitmq-definitions

prometheus.tcp.port = 15692
# Aggregated metrics on /metrics; per-queue depth comes from
# /metrics/detailed?family=queue_coarse_metrics (see prometheus.yml), which
# keeps series per queue, not per connection or channel.
prometheus.return_per_object_metrics = false
