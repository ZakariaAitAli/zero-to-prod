# Zero-to-Prod security lab ingress.
#
# The only published entry point of the lab. It terminates TLS with a
# certificate issued by the lab's private CA, serves the built Web UI, and
# forwards an explicit allow-list of API routes to the internal API.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # The client's original path, without the query string; query strings
    # are not logged.
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }

    log_format ingress '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent host=$host upstream=$upstream_status '
                       'rt=$request_time';
    access_log /dev/stdout ingress;

    upstream work_items_api {
        server api:8080;
        keepalive 8;
    }

    # Container health check only; bound to the container loopback.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # Requests for any other name, or by IP address, fail the TLS handshake.
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name work-items.localhost;

        # Key and certificate in one file, replaced atomically on renewal.
        ssl_certificate /run/ingress-tls/tls.pem;
        ssl_certificate_key /run/ingress-tls/tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # API routes are allow-listed; everything else under /api is not
        # routed, including the API's internal health, readiness, and
        # version endpoints.
        location ~ ^/api/(items|items/[0-9]+/process|processing-jobs/[0-9]+)$ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://work_items_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # Replace, never append, client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location /api {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
