# Zero-to-Prod security lab ingress.
#
# The only published entry point of the lab. It terminates TLS with a
# certificate issued by the lab's private CA, serves the built Web UI,
# forwards an explicit allow-list of API routes to the internal API, and
# fronts the identity provider.
#
# API requests take one of two paths (ADR 0004):
#   - session: a browser with an oauth2-proxy session cookie. nginx asks
#     oauth2-proxy (auth_request), replaces the request's credentials with the
#     session's access token, and enforces CSRF checks on state changes.
#   - bearer: a machine client with its own access token and no session
#     cookie. The token is passed to the API unchanged.
# Either way the API validates the token itself.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Keycloak and oauth2-proxy responses carry large cookies and headers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # The client's original path, without the query string; query strings
    # (which carry authorization codes and state) are not logged.
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }

    # Keep authentication material (authorization codes, state, tokens,
    # cookies) out of the access log: it records the path without the query
    # string, and no headers or cookies. It keeps status, upstream status,
    # upstream address, upstream connect time, total request time, and a
    # request ID; the ID is also sent to oauth2-proxy and returned to the
    # client, so a gateway log line can be matched to its path here. These
    # fields are what remains of upstream failures once the public servers'
    # error-log entries below crit are suppressed (see below).
    log_format ingress '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent host=$host upstream=$upstream_status '
                       'uaddr=$upstream_addr uct=$upstream_connect_time '
                       'route=$api_route rid=$request_id rt=$request_time';
    access_log /dev/stdout ingress;

    # Whether the request carries an oauth2-proxy session cookie. ($cookie_*
    # variables cannot name a cookie containing a hyphen.)
    map $http_cookie $has_gateway_session {
        default 0;
        "~(^|;\s*)__Host-wi-session=" 1;
    }

    map $http_authorization $has_bearer_token {
        default 0;
        "~*^Bearer\s+\S" 1;
    }

    # A request with both a session cookie and a bearer token is ambiguous
    # and refused rather than silently preferring either credential.
    map "$has_bearer_token$has_gateway_session" $api_route {
        "10" bearer;
        "11" ambiguous;
        default session;
    }

    map $request_method $state_changing {
        GET 0;
        HEAD 0;
        default 1;
    }

    # Fetch metadata: absent (older clients) or same-origin is accepted.
    map $http_sec_fetch_site $fetch_site_allowed {
        "" 1;
        same-origin 1;
        default 0;
    }

    # Sent by the Web UI; a cross-origin page cannot add it without a CORS
    # preflight, which the ingress never approves.
    map $http_x_requested_with $csrf_header_present {
        work-items-web 1;
        default 0;
    }

    # Resolve oauth2-proxy and Keycloak at request time, so the ingress starts
    # and reports explicit errors while either is stopped. Short timeouts make
    # a stopped upstream an immediate error instead of a hang.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    upstream work_items_api {
        server api:8080;
        keepalive 8;
    }

    # Container health check only; bound to the container loopback.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # Content-phase 401 used after the session-store readiness check passes.
    server {
        listen 127.0.0.1:8091;
        access_log off;

        location / {
            default_type application/json;
            return 401 '{"error":"unauthenticated"}\n';
        }
    }

    # Requests for any other name, or by IP address, fail the TLS handshake.
    # 8443 is published as host port 9443; 9443 serves internal clients that
    # reach the public names through network aliases.
    server {
        listen 8443 ssl default_server;
        listen 9443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 8443 ssl;
        listen 9443 ssl;
        http2 on;
        server_name work-items.localhost;

        # Key and certificate in one file, replaced atomically on renewal.
        ssl_certificate /run/ingress-tls/tls.pem;
        ssl_certificate_key /run/ingress-tls/tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # nginx's error log writes the full request line, including the
        # query string (an authorization code on a failed callback), and the
        # referrer; its format cannot be changed. Error-log entries below crit
        # from requests in this server are therefore suppressed, including the
        # error-level entries for upstream connection failures and timeouts,
        # and with them the failure reason. The access log still records the
        # status, upstream status, address, and connect time, the request
        # time, and the request ID. Startup and configuration errors still
        # use the main level.
        error_log /dev/stderr crit;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Request-Id $request_id always;

        set $oauth2_proxy http://oauth2-proxy:4180;

        # Same-origin when the browser sends an Origin header at all.
        set $origin_allowed 0;
        if ($http_origin = "") {
            set $origin_allowed 1;
        }
        if ($http_origin = "https://$http_host") {
            set $origin_allowed 1;
        }

        # A state-changing request that carries the ambient session cookie
        # needs the UI header, an allowed Origin, and allowed fetch metadata.
        # Fields: cookie, state-changing, header, origin, fetch site.
        set $csrf_inputs "$has_gateway_session$state_changing$csrf_header_present$origin_allowed$fetch_site_allowed";

        # @session_rejected is reached through error_page 401; its own
        # readiness check can fail with 500, which must map to 503 as well.
        recursive_error_pages on;

        # --- Gateway endpoints -------------------------------------------------

        location ~ ^/oauth2/(start|callback|userinfo)$ {
            proxy_pass $oauth2_proxy;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            error_page 502 504 = @authentication_unavailable;
        }

        # Sign-out changes state, so it is POST-only and same-origin. A form
        # post cannot carry the UI header, so Origin is required instead.
        # oauth2-proxy deletes the server-side session and ends the Keycloak
        # session through its backend logout URL.
        location = /oauth2/sign_out {
            if ($request_method != POST) {
                add_header Allow POST always;
                return 405 '{"error":"method_not_allowed"}\n';
            }
            if ($http_origin != "https://$http_host") {
                return 403 '{"error":"csrf_rejected"}\n';
            }
            if ($fetch_site_allowed = 0) {
                return 403 '{"error":"csrf_rejected"}\n';
            }

            default_type application/json;
            proxy_pass $oauth2_proxy;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            error_page 502 504 = @authentication_unavailable;
        }

        location /oauth2/ {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }

        location = /_oauth2_auth {
            internal;
            proxy_pass $oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
        }

        # Separate observation, with a documented race: oauth2-proxy answers
        # 401 both for an invalid session and when its session store is
        # unreachable. Without a session cookie the request is
        # unauthenticated. With one, ask oauth2-proxy's /ready endpoint, which
        # reports session-store connectivity at that moment: ready means the
        # session is invalid (401); not ready means it cannot be checked (503).
        # /ready reflects the state when it is asked, not the cause of the
        # original 401.
        location @session_rejected {
            default_type application/json;
            if ($has_gateway_session = 0) {
                return 401 '{"error":"unauthenticated"}\n';
            }
            auth_request /_oauth2_ready;
            error_page 500 = @authentication_unavailable;
            proxy_pass http://127.0.0.1:8091;
        }

        location = /_oauth2_ready {
            internal;
            proxy_pass $oauth2_proxy/ready;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
        }

        # auth_request reports an unreachable gateway as 500.
        location @authentication_unavailable {
            default_type application/json;
            return 503 '{"error":"authentication_unavailable"}\n';
        }

        # --- API ---------------------------------------------------------------

        # API routes are allow-listed; everything else under /api is not
        # routed, including the API's internal health, readiness, and
        # version endpoints.
        location ~ ^/api/(items|items/[0-9]+/process|processing-jobs/[0-9]+)$ {
            default_type application/json;

            if ($api_route = ambiguous) {
                return 400 '{"error":"ambiguous_credentials"}\n';
            }
            if ($api_route = bearer) {
                rewrite ^/api/(.*)$ /_bearer/$1 last;
            }
            if ($csrf_inputs ~ "^11(0..|.0.|..0)$") {
                return 403 '{"error":"csrf_rejected"}\n';
            }

            auth_request /_oauth2_auth;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;
            error_page 401 = @session_rejected;
            error_page 500 = @authentication_unavailable;

            # When oauth2-proxy refreshes a session it issues a new session
            # cookie (new signed value, new Max-Age) on its auth response,
            # which auth_request would otherwise discard. Forward it as sent,
            # with its Secure, HttpOnly, and SameSite attributes. oauth2-proxy
            # sends one session cookie here; a second Set-Cookie would not be
            # forwarded correctly by this variable.
            auth_request_set $refreshed_session_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $refreshed_session_cookie always;
            # An add_header here replaces the server's inherited headers, so
            # they are repeated.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Request-Id $request_id always;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://work_items_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # The session's token replaces any client credential; the session
            # cookie does not reach the API.
            proxy_set_header Authorization "Bearer $access_token";
            proxy_set_header Cookie "";

            # Replace, never append, client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Machine clients: the bearer token goes to the API unchanged; there
        # is no ambient credential, so no CSRF check applies.
        location /_bearer/ {
            internal;
            rewrite ^/_bearer(/.*)$ $1 break;
            proxy_pass http://work_items_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Cookie "";

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location /api {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Keycloak: only the work-items realm and its static resources. The
    # administration console and master realm are not routed.
    server {
        listen 8443 ssl;
        listen 9443 ssl;
        server_name auth.work-items.localhost;

        ssl_certificate /run/ingress-tls/tls.pem;
        ssl_certificate_key /run/ingress-tls/tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # Authorization requests carry state and PKCE parameters in the query
        # string; as in the work-items server, error-log entries below crit
        # from requests are suppressed.
        error_log /dev/stderr crit;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Request-Id $request_id always;

        set $keycloak http://keycloak:8080;

        location @identity_provider_unavailable {
            default_type application/json;
            return 503 '{"error":"identity_provider_unavailable"}\n';
        }

        location ~ ^/(realms/work-items/|resources/) {
            proxy_pass $keycloak;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 2s;
            error_page 502 504 = @identity_provider_unavailable;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }
    }
}
