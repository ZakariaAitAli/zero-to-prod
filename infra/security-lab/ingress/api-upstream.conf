# TLS from the ingress to the Work Items API (ADR 0008). Included in every
# location that proxies to the API, and in the diagnostic route.
#
# The only trust anchor is the application CA, which may issue only for the
# names api and oauth2-proxy; the lab CA (browser-trusted), the internal CA
# (datastores), and the identity-provider CA are not trusted here.
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /run/app-ca/ca.crt;

# The name dialed. The certificate must carry it; it is also sent as SNI.
# With an upstream block nginx would otherwise check the group name.
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# No cached sessions; the API does not issue session tickets either.
# Connections kept alive in the upstream pool are not re-verified; their
# lifetime is bounded in the upstream block.
proxy_ssl_session_reuse off;
