# TLS from the ingress to Keycloak (ADR 0007). Included wherever the ingress
# proxies to Keycloak, so the public route and the diagnostic route verify
# the same way.
#
# The only trust anchor is the identity-provider CA, which may issue only for
# the name keycloak; the lab CA (browser-trusted) and the internal CA
# (datastores) are not trusted here.
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /run/idp-ca/ca.crt;

# The name dialed. The certificate must carry it; it is also sent as SNI.
proxy_ssl_name keycloak;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# No cached upstream sessions: every connection performs a full handshake and
# verifies the certificate Keycloak serves at that moment. The proxy_pass
# target is a variable and nginx keeps no upstream connections to it, so
# nothing negotiated before a certificate change is reused.
proxy_ssl_session_reuse off;
