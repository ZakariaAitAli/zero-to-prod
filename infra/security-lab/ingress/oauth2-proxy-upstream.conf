# TLS from the ingress to oauth2-proxy (ADR 0008). Included in every location
# that proxies to the gateway (sign-in, callback, user info, sign-out,
# auth_request, readiness), and in the diagnostic route.
#
# The only trust anchor is the application CA, which may issue only for the
# names api and oauth2-proxy.
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /run/app-ca/ca.crt;

# The name dialed. The certificate must carry it; it is also sent as SNI.
proxy_ssl_name oauth2-proxy;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# No cached sessions. The proxy_pass target is a variable and nginx keeps no
# connections to it, so every request performs a full handshake and verifies
# the certificate oauth2-proxy serves at that moment.
proxy_ssl_session_reuse off;
