# Zero-to-Prod security lab RabbitMQ configuration.
#
# No host ports are published. Users, permissions, the vhost, and the
# processing queue come from a definitions file generated outside Git with
# per-lab password hashes; no default user is configured.
#
# AMQP is offered only over TLS (ADR 0006): the plaintext listener is
# disabled, so a client cannot fall back to it. Clients verify the server
# against the internal CA and the name "rabbitmq"; the server does not ask
# for client certificates and authenticates clients by password (PLAIN,
# inside TLS).
listeners.tcp = none
listeners.ssl.default = 5671

# Key and certificate in one file in a read-only directory mount, replaced
# by rename on renewal; see the security lab guide for the reload step.
ssl_options.certfile = /run/internal-tls/tls.pem
ssl_options.keyfile = /run/internal-tls/tls.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

load_definitions = /run/secrets/rabbitmq-definitions
