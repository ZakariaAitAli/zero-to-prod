# Issue #121 authentication comparison experiment (scaffolding).
#
# An overlay on infra/security-lab/compose.yaml, used only through
# tools/security-lab-auth-experiment. Candidates run under profiles so each
# configuration can be measured alone and removed after the evidence is
# recorded. Nothing here publishes a host port. The cookie-store control and
# the Pomerium arm were removed after their evidence was recorded (ADR 0004).

services:
  ingress:
    volumes:
      # Relative paths resolve from the base file's directory (infra/security-lab).
      - ./auth-experiment/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificate for every experiment host name, issued by the lab CA.
      - ${ZTP_AUTH_EXPERIMENT_TLS_DIR:?set by tools/security-lab-auth-experiment}:/run/ingress-tls:ro
    networks:
      app:
        aliases:
          - work-items.localhost
          - auth.work-items.localhost
      idp: {}

  keycloak-postgres:
    profiles: [keycloak]
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak-db-password
    secrets:
      - keycloak-db-password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    networks:
      - idp-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start", "--import-realm"]
    volumes:
      # Generated configuration (database password, hostname, proxy settings).
      - ${ZTP_AUTH_EXPERIMENT_SECRETS_DIR:?set by tools/security-lab-auth-experiment}/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ${ZTP_AUTH_EXPERIMENT_SECRETS_DIR:?set by tools/security-lab-auth-experiment}/realm-work-items.json:/opt/keycloak/data/import/work-items.json:ro
    networks:
      - idp
      - idp-data
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  valkey:
    profiles: [oauth2-proxy-server-side]
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "/run/secrets/valkey.conf"]
    secrets:
      - valkey.conf
    networks:
      - session
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$(sed -n 's/^requirepass //p' /run/secrets/valkey.conf)\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The cookie-store control (A1) was removed after its evidence was recorded:
  # it does not meet the server-side-session requirement.

  oauth2-proxy-server-side:
    profiles: [oauth2-proxy-server-side]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    command: ["--config=/run/secrets/oauth2-proxy-server-side.cfg"]
    secrets:
      - oauth2-proxy-server-side.cfg
    volumes:
      - ${ZTP_AUTH_EXPERIMENT_CA_FILE:?set by tools/security-lab-auth-experiment}:/lab-ca/ca.crt:ro
    networks:
      app:
        aliases: [oauth2-proxy]
      session: {}
    read_only: true
    # OIDC discovery runs at startup and the process exits if it fails.
    depends_on:
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy


  # One-off probes and administrative calls on the identity network.
  idp-probe:
    profiles: [probe]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    networks:
      - idp

networks:
  idp:
    internal: true
  idp-data:
    internal: true
  session:
    internal: true

volumes:
  keycloak_postgres_data:

secrets:
  keycloak-db-password:
    file: ${ZTP_AUTH_EXPERIMENT_SECRETS_DIR:?set by tools/security-lab-auth-experiment}/keycloak-db-password
  valkey.conf:
    file: ${ZTP_AUTH_EXPERIMENT_SECRETS_DIR:?set by tools/security-lab-auth-experiment}/valkey.conf
  oauth2-proxy-server-side.cfg:
    file: ${ZTP_AUTH_EXPERIMENT_SECRETS_DIR:?set by tools/security-lab-auth-experiment}/oauth2-proxy-server-side.cfg
