# Issue #121 authentication comparison experiment ingress (scaffolding).
#
# Extends the security lab ingress with the identity-provider host, oauth2-proxy
# auth_request on /api, and an inspection endpoint that echoes
# the Authorization header the gateway would send upstream. The inspection
# endpoint exists only for this experiment and is removed with it.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_max_body_size 64k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
    }

    # Whether the request carries an oauth2-proxy session cookie. ($cookie_*
    # variables cannot name a cookie containing a hyphen.)
    map $http_cookie $has_gateway_session {
        default 0;
        "~(^|;\s*)__Host-wi-session=" 1;
    }

    log_format ingress '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent host=$host upstream=$upstream_status '
                       'rt=$request_time';
    access_log /dev/stdout ingress;

    # Resolve upstreams at request time so optional candidates can be absent.
    # Short timeouts make a stopped upstream an immediate, explicit error
    # instead of a hang on a cached address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    proxy_connect_timeout 2s;

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz { return 200 "ok\n"; }
        location / { return 404; }
    }

    # Experiment-only upstream: returns the Authorization header it received.
    server {
        listen 8090;
        access_log off;
        location / {
            default_type text/plain;
            return 200 "$http_authorization";
        }
    }

    # Content-phase 401 used after the session-store check passes.
    server {
        listen 127.0.0.1:8091;
        access_log off;
        location / {
            default_type application/json;
            return 401 '{"error":"unauthenticated"}\n';
        }
    }

    server {
        listen 8443 ssl default_server;
        listen 9443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Work Items, guarded by oauth2-proxy.
    server {
        listen 8443 ssl;
        listen 9443 ssl;
        http2 on;
        server_name work-items.localhost;

        ssl_certificate /run/ingress-tls/tls.pem;
        ssl_certificate_key /run/ingress-tls/tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        set $oauth2_proxy http://oauth2-proxy:4180;
        set $work_items_api http://api:8080;

        # @session_rejected is reached through error_page 401; its own
        # readiness check can fail with 500, which must map to 503 as well.
        recursive_error_pages on;

        location /oauth2/ {
            proxy_pass $oauth2_proxy;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP "";
        }

        location = /_oauth2_auth {
            internal;
            proxy_pass $oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Uri $request_uri;
        }

        # A failed auth subrequest (gateway or its store unreachable) is a
        # 500 from auth_request; report it as an explicit 503.
        location @authentication_unavailable {
            default_type application/json;
            return 503 '{"error":"authentication_unavailable"}\n';
        }

        location @unauthenticated {
            default_type application/json;
            return 401 '{"error":"unauthenticated"}\n';
        }

        # oauth2-proxy answers 401 both for an invalid session and when its
        # session store is unreachable. Without a session cookie the request
        # is unauthenticated. With one, ask oauth2-proxy's /ready endpoint
        # (which reports session-store connectivity): ready means the session
        # is genuinely invalid (401); not ready means it cannot be checked
        # (503).
        location @session_rejected {
            default_type application/json;
            if ($has_gateway_session = 0) {
                return 401 '{"error":"unauthenticated"}\n';
            }
            auth_request /_oauth2_ready;
            error_page 500 = @authentication_unavailable;
            proxy_pass http://127.0.0.1:8091;
        }

        location = /_oauth2_ready {
            internal;
            proxy_pass $oauth2_proxy/ready;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
        }

        location ~ ^/api/(items|items/[0-9]+/process|processing-jobs/[0-9]+)$ {
            auth_request /_oauth2_auth;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;
            error_page 401 = @session_rejected;
            error_page 500 = @authentication_unavailable;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $work_items_api;
            proxy_set_header Host $host;
            proxy_set_header Authorization "Bearer $access_token";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
        }

        # Experiment-only: shows the Authorization header the gateway path
        # sends upstream, so its claims can be inspected.
        location = /_experiment/upstream-view {
            auth_request /_oauth2_auth;
            auth_request_set $access_token $upstream_http_x_auth_request_access_token;
            error_page 401 = @session_rejected;
            error_page 500 = @authentication_unavailable;

            proxy_pass http://127.0.0.1:8090/;
            proxy_set_header Authorization "Bearer $access_token";
            proxy_set_header Cookie "";
        }

        location /api {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Keycloak: only the work-items realm and static resources.
    server {
        listen 8443 ssl;
        listen 9443 ssl;
        server_name auth.work-items.localhost;

        ssl_certificate /run/ingress-tls/tls.pem;
        ssl_certificate_key /run/ingress-tls/tls.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        set $keycloak http://keycloak:8080;

        location @identity_provider_unavailable {
            default_type application/json;
            return 503 '{"error":"identity_provider_unavailable"}\n';
        }

        location ~ ^/(realms/work-items/|resources/) {
            proxy_pass $keycloak;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_intercept_errors off;
            error_page 502 504 = @identity_provider_unavailable;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}\n';
        }
    }

}
