# Zero-to-Prod security lab (opt-in, local-first).
#
# Use through tools/security-lab-local, which checks the runtime secret
# files before starting. With the verified Compose 5.3.1 / Docker Desktop
# setup, a missing secret file did not fail: an empty directory was mounted
# in its place.
#
# Only the ingress publishes a port, on host loopback. The API, worker,
# PostgreSQL, RabbitMQ, Keycloak, oauth2-proxy, and Valkey are reachable only
# on internal networks.
#
# Authentication (ADR 0004, Proposed): Keycloak is the identity provider;
# oauth2-proxy holds browser sessions in Valkey behind nginx auth_request and
# forwards the access token; machine clients send their own bearer token. The
# API validates every token itself (AUTHENTICATION=oidc). The issuer URL
# names the ingress, which internal clients reach through network aliases.

name: zero-to-prod-security-lab

x-hardened: &hardened
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: zero_to_prod
      POSTGRES_USER: zero_to_prod_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
      ZTP_POSTGRES_MIGRATOR_USER: zero_to_prod_migrator
      ZTP_POSTGRES_APP_USER: zero_to_prod_app
      ZTP_POSTGRES_WORKER_USER: zero_to_prod_worker
    secrets:
      - postgres-admin-password
      - postgres-migrator-password
      - postgres-app-password
      - postgres-worker-password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../local/postgres/init/001-roles.sh:/opt/zero-to-prod/001-roles.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:cdf40d8cb363d145e377ed88d59696a42386ffe54b30125f10eb128b862eea95
    hostname: zero-to-prod-security-lab-rabbitmq
    secrets:
      - rabbitmq-definitions
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  migrate:
    profiles:
      - tools
    build:
      context: ../../tools/migrate
    image: zero-to-prod-migrate:v4.20.1
    entrypoint:
      - /bin/sh
      - -c
      - exec migrate -path=/migrations -database "$$(cat /run/secrets/postgres-migrator-url)" "$$@"
      - migrate
    command: ["up"]
    secrets:
      - postgres-migrator-url
    volumes:
      - ../../apps/work-items/migrations:/migrations:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hardened
    build:
      context: ../../apps/work-items
      dockerfile: api/Dockerfile
      args:
        VERSION: ${ZTP_SECURITY_LAB_VERSION:-security-lab}
    # Overridden only by verify-authorization's old-baseline control, which
    # runs an image built from the pinned pre-authorization commit.
    image: ${ZTP_SECURITY_LAB_API_IMAGE:-zero-to-prod-security-lab-api:local}
    environment:
      # Required in the lab; only local development disables it.
      AUTHENTICATION: oidc
      OIDC_ISSUER_URL: https://auth.work-items.localhost:9443/realms/work-items
      OIDC_AUDIENCE: work-items-api
      OIDC_JWKS_URL: https://auth.work-items.localhost:9443/realms/work-items/protocol/openid-connect/certs
      OIDC_CA_FILE: /lab-ca/ca.crt
      DATABASE_URL_FILE: /run/secrets/api-database-url
      RABBITMQ_PUBLISHER_URL_FILE: /run/secrets/api-rabbitmq-url
    secrets:
      - api-database-url
      - api-rabbitmq-url
    volumes:
      # Public CA certificate; replaced only by purge-state and init.
      - ${ZTP_SECURITY_LAB_CA_FILE:?set by tools/security-lab-local}:/lab-ca/ca.crt:ro
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *hardened
    build:
      context: ../../apps/work-items
      dockerfile: worker/Dockerfile
    image: zero-to-prod-security-lab-worker:local
    environment:
      DATABASE_URL_FILE: /run/secrets/worker-database-url
      RABBITMQ_WORKER_URL_FILE: /run/secrets/worker-rabbitmq-url
    secrets:
      - worker-database-url
      - worker-rabbitmq-url
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ingress:
    <<: *hardened
    build:
      context: ../..
      dockerfile: infra/security-lab/ingress/Dockerfile
    image: zero-to-prod-security-lab-ingress:local
    user: "101:101"
    ports:
      # The issuer URL carries this port, so it is fixed (see the guide).
      - "127.0.0.1:9443:8443"
    tmpfs:
      - /tmp
      - /var/cache/nginx
    volumes:
      # A directory mount, so a renewed certificate (replaced by rename) is
      # visible to nginx on reload; a single-file mount keeps the old inode.
      - ${ZTP_SECURITY_LAB_INGRESS_TLS_DIR:?set by tools/security-lab-local}:/run/ingress-tls:ro
    networks:
      edge: {}
      app:
        # Internal clients (the API and oauth2-proxy) reach the public names,
        # and so the issuer, on the ingress's internal 9443 listener.
        aliases:
          - work-items.localhost
          - auth.work-items.localhost
      idp: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  keycloak-postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak-db-password
    secrets:
      - keycloak-db-password
    volumes:
      - identity_postgres_data:/var/lib/postgresql
    networks:
      - idp-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    # The realm is imported only when it does not exist yet; see the guide.
    command: ["start", "--import-realm"]
    volumes:
      # Generated: database password, hostname, and proxy settings.
      - ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/realm-work-items.json:/opt/keycloak/data/import/work-items.json:ro
    networks:
      - idp
      - idp-data
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      # Requires HTTP 200; the body reports "UP" during bootstrap as well.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "/run/secrets/valkey.conf"]
    read_only: true
    secrets:
      - valkey.conf
    # Sessions are not persisted: a restart signs everyone out.
    tmpfs:
      - /data
    networks:
      - session
    healthcheck:
      # Authenticated check without the password in any process argument or
      # environment: the shell reads it from the secret file and sends AUTH
      # and PING to valkey-cli on standard input (printf is a shell builtin).
      # PING after a failed AUTH answers NOAUTH, so PONG requires the password.
      test:
        - CMD-SHELL
        - >-
          printf 'AUTH %s\nPING\n' "$$(sed -n 's/^requirepass //p' /run/secrets/valkey.conf)"
          | valkey-cli | grep -qx PONG
      interval: 2s
      timeout: 3s
      retries: 15

  oauth2-proxy:
    <<: *hardened
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    command: ["--config=/run/secrets/oauth2-proxy.cfg"]
    secrets:
      - oauth2-proxy.cfg
    volumes:
      - ${ZTP_SECURITY_LAB_CA_FILE:?set by tools/security-lab-local}:/lab-ca/ca.crt:ro
    networks:
      - app
      - session
    # OIDC discovery runs at startup, through the ingress, and the process
    # exits if it fails.
    depends_on:
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ingress:
        condition: service_healthy

networks:
  # The only network with external connectivity; required to publish the
  # ingress port.
  edge: {}
  app:
    internal: true
  data:
    internal: true
  # Ingress to Keycloak.
  idp:
    internal: true
  # Keycloak to its own database.
  idp-data:
    internal: true
  # oauth2-proxy to its session store.
  session:
    internal: true

volumes:
  postgres_data:
  rabbitmq_data:
  # Named apart from the comparison experiment's keycloak_postgres_data,
  # whose realm holds that experiment's client secrets.
  identity_postgres_data:

secrets:
  postgres-admin-password:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/postgres-admin-password
  postgres-migrator-password:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/postgres-migrator-password
  postgres-app-password:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/postgres-app-password
  postgres-worker-password:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/postgres-worker-password
  postgres-migrator-url:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/postgres-migrator-url
  api-database-url:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/api-database-url
  api-rabbitmq-url:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/api-rabbitmq-url
  worker-database-url:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/worker-database-url
  worker-rabbitmq-url:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/worker-rabbitmq-url
  rabbitmq-definitions:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/rabbitmq-definitions
  keycloak-db-password:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/keycloak-db-password
  valkey.conf:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/valkey.conf
  oauth2-proxy.cfg:
    file: ${ZTP_SECURITY_LAB_SECRETS_DIR:?set by tools/security-lab-local}/oauth2-proxy.cfg
