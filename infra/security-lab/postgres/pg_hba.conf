# Zero-to-Prod security lab PostgreSQL client authentication (ADR 0006).
#
# Used instead of the pg_hba.conf the image writes into the data directory
# (hba_file in compose.yaml), so existing volumes get the same rules.
#
# Network clients must use TLS; a plaintext connection is rejected before
# authentication, whatever the client asks for. Clients verify the server
# (sslmode=verify-full against the internal CA); the server authenticates
# clients by password (SCRAM), not by certificate.

# TYPE    DATABASE  USER  ADDRESS  METHOD

# The container-local socket: initialization, identity re-application, and
# the health check. Unchanged from the image's default.
local     all       all            trust

hostssl   all       all   all      scram-sha-256
hostnossl all       all   all      reject
