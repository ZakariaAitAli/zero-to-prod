worker_processes 1;
events { worker_connections 2048; }
http {
  access_log off;
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream api_pool {
    zone api_pool 64k;
    server api:8080 resolve;
    keepalive 32;
  }
  # Same API per-IP rate/burst as ADR 0010, isolated HTTP comparison only.
  # Port 8080 disables admission; 8081 enables it, without a bypass header.
  map $server_port $admission_key { 8081 $binary_remote_addr; default ''; }
  limit_req_zone $admission_key zone=api:10m rate=20r/s;
  server {
    listen 8080;
    listen 8081;
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    error_page 429 = @limited;
    location @limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":"rate_limited"}';
    }
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      # POST retries can duplicate item creation; do not retry upstream calls.
      proxy_next_upstream off;
      proxy_read_timeout 15s;
    }
  }
}
