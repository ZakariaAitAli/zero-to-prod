global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: work-items-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464
        refresh_interval: 5s
  - job_name: work-items-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9465
        refresh_interval: 5s
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ['rabbitmq:15692']
