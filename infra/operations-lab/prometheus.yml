global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: operations-lab

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/drills.yml

scrape_configs:
  - job_name: work-items-api
    static_configs:
      - targets: ["api:9464"]

  - job_name: work-items-worker
    static_configs:
      - targets: ["worker:9465"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Per-queue depth and consumers: bounded by the number of queues (one).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
