name: zero-to-prod-local

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

    environment:
      POSTGRES_DB: ${ZTP_POSTGRES_DB:-zero_to_prod}
      POSTGRES_USER: ${ZTP_POSTGRES_ADMIN_USER:-zero_to_prod_admin}
      POSTGRES_PASSWORD: ${ZTP_POSTGRES_ADMIN_PASSWORD:-zero-to-prod-local-admin}
      ZTP_POSTGRES_MIGRATOR_USER: ${ZTP_POSTGRES_MIGRATOR_USER:-zero_to_prod_migrator}
      ZTP_POSTGRES_MIGRATOR_PASSWORD: ${ZTP_POSTGRES_MIGRATOR_PASSWORD:-zero-to-prod-local-migrator}
      ZTP_POSTGRES_APP_USER: ${ZTP_POSTGRES_APP_USER:-zero_to_prod_app}
      ZTP_POSTGRES_APP_PASSWORD: ${ZTP_POSTGRES_APP_PASSWORD:-zero-to-prod-local-app}

    ports:
      - "127.0.0.1:${ZTP_POSTGRES_PORT:-55432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
